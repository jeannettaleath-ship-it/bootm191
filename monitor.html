<!DOCTYPE html>
<html>
<head><title>Control Panel</title></head>
<body style="background:#000; color:#00ff00; text-align:center;">
    <h3>بث مباشر للشاشة</h3>
    <img id="display" src="" style="width:90%; max-width:400px; border:2px solid #333; border-radius:10px;">
    <p id="status">بانتظار الإشارة...</p>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const img = document.getElementById('display');
        const status = document.getElementById('status');

        socket.on('update_monitor', (data) => {
            img.src = data;
            status.innerText = "✅ متصل - تحديث حي";
        });

        socket.on('disconnect', () => {
            status.innerText = "⚠️ انقطع الاتصال - يحاول الجهاز العودة...";
        });
    </script>
</body>
</html>
